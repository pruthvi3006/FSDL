<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Items - SecondHand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/" class="logo">🛒 SecondHand</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/items">Browse Items</a></li>
        <li id="nav-sell"><a href="/sell">Sell Item</a></li>
        <li id="nav-cart"><a href="/cart">🛒 Cart</a></li>
        <li id="nav-profile"><a href="/profile">👤 Profile</a></li>
        <li id="nav-auth"><a href="/login">Login</a></li>
        <li id="nav-logout"><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Items Page -->
  <section class="items-page">
    <div class="container">
      <div class="items-layout">
        <!-- Filters Sidebar -->
        <aside class="filters-sidebar">
          <h3>Filters</h3>
          
          <div class="filter-group">
            <label>Category</label>
            <select id="category-filter" onchange="applyFilters()">
              <option value="">All Categories</option>
              <option value="Car">Car</option>
              <option value="Bike">Bike</option>
              <option value="Electronics">Electronics</option>
              <option value="Furniture">Furniture</option>
              <option value="Clothing">Clothing</option>
              <option value="Books">Books</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Condition</label>
            <select id="condition-filter" onchange="applyFilters()">
              <option value="">All Conditions</option>
              <option value="Like New">Like New</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Price Range</label>
            <input type="number" id="min-price" placeholder="Min Price" onchange="applyFilters()">
            <input type="number" id="max-price" placeholder="Max Price" onchange="applyFilters()">
          </div>

          <div class="filter-group">
            <label>Search</label>
            <input type="text" id="search-filter" placeholder="Search items" onchange="applyFilters()">
          </div>

          <button class="btn-primary" onclick="resetFilters()">Reset Filters</button>
        </aside>

        <!-- Items Grid -->
        <div class="items-content">
          <div id="items-grid" class="items-grid">
            <!-- Items will be loaded here -->
          </div>
          <div id="pagination" class="pagination">
            <!-- Pagination will be here -->
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 SecondHand - Buy & Sell Used Items. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/items.js"></script>
</body>
</html>
