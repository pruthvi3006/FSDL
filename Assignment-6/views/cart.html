<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - SecondHand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/" class="logo">🛒 SecondHand</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/items">Browse Items</a></li>
        <li id="nav-sell"><a href="/sell">Sell Item</a></li>
        <li id="nav-cart"><a href="/cart">🛒 Cart</a></li>
        <li id="nav-profile"><a href="/profile">👤 Profile</a></li>
        <li id="nav-auth"><a href="/login">Login</a></li>
        <li id="nav-logout"><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Cart Page -->
  <section class="cart-section">
    <div class="container">
      <h2>Shopping Cart</h2>
      <div class="cart-layout">
        <div class="cart-items" id="cart-items">
          <!-- Cart items will be loaded here -->
        </div>
        <div class="cart-summary">
          <h3>Order Summary</h3>
          <div class="summary-row">
            <span>Subtotal:</span>
            <span id="subtotal">₹0</span>
          </div>
          <div class="summary-row">
            <span>Shipping:</span>
            <span>Free</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            <span id="total">₹0</span>
          </div>
          <button class="btn-primary" onclick="checkout()">Proceed to Checkout</button>
          <a href="/items" class="btn-secondary">Continue Shopping</a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 SecondHand - Buy & Sell Used Items. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
