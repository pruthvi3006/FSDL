<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - SecondHand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/" class="logo">🛒 SecondHand</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/items">Browse Items</a></li>
        <li id="nav-sell"><a href="/sell">Sell Item</a></li>
        <li id="nav-cart"><a href="/cart">🛒 Cart</a></li>
        <li id="nav-profile"><a href="/profile">👤 Profile</a></li>
        <li id="nav-auth"><a href="/login">Login</a></li>
        <li id="nav-logout"><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Profile Page -->
  <section class="profile-section">
    <div class="container">
      <h2>My Profile</h2>
      <div class="profile-container">
        <form id="profile-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" disabled>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="phone">
          </div>

          <div class="form-group">
            <label>Address</label>
            <input type="text" id="address">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="city">
            </div>
            <div class="form-group">
              <label>State</label>
              <input type="text" id="state">
            </div>
            <div class="form-group">
              <label>Zipcode</label>
              <input type="text" id="zipcode">
            </div>
          </div>

          <button type="submit" class="btn-primary">Update Profile</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 SecondHand - Buy & Sell Used Items. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
