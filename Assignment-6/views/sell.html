<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Item - SecondHand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/" class="logo">🛒 SecondHand</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/items">Browse Items</a></li>
        <li id="nav-sell"><a href="/sell">Sell Item</a></li>
        <li id="nav-cart"><a href="/cart">🛒 Cart</a></li>
        <li id="nav-profile"><a href="/profile">👤 Profile</a></li>
        <li id="nav-auth"><a href="/login">Login</a></li>
        <li id="nav-logout"><a href="#" onclick="logout()">Logout</a></li>
      </ul>
    </div>
  </nav>

  <!-- Sell Item Form -->
  <section class="sell-section">
    <div class="container">
      <div class="form-container">
        <h2>Sell Your Item</h2>
        <form id="sell-form">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="title" required placeholder="e.g., 2015 Honda Civic">
          </div>

          <div class="form-group">
            <label>Description</label>
            <textarea id="description" required placeholder="Describe your item in detail"></textarea>
          </div>

          <div class="form-group">
            <label>Category</label>
            <select id="category" required>
              <option value="">Select Category</option>
              <option value="Car">Car</option>
              <option value="Bike">Bike</option>
              <option value="Electronics">Electronics</option>
              <option value="Furniture">Furniture</option>
              <option value="Clothing">Clothing</option>
              <option value="Books">Books</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Price</label>
              <input type="number" id="price" required placeholder="Asking price">
            </div>
            <div class="form-group">
              <label>Original Price</label>
              <input type="number" id="originalPrice" placeholder="Original price (optional)">
            </div>
          </div>

          <div class="form-group">
            <label>Condition</label>
            <select id="condition" required>
              <option value="Good">Good</option>
              <option value="Like New">Like New</option>
              <option value="Fair">Fair</option>
              <option value="Poor">Poor</option>
            </select>
          </div>

          <div class="form-group">
            <label>Location</label>
            <input type="text" id="location" required placeholder="Your location">
          </div>

          <button type="submit" class="btn-primary">Post Item</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 SecondHand - Buy & Sell Used Items. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/sell.js"></script>
</body>
</html>
