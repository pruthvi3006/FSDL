<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SecondHand</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <div class="container">
      <div class="nav-brand">
        <a href="/" class="logo">🛒 SecondHand</a>
      </div>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/items">Browse Items</a></li>
      </ul>
    </div>
  </nav>

  <!-- Login Section -->
  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-form">
        <h2>Login</h2>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
          </div>

          <button type="submit" class="btn-primary">Login</button>
        </form>

        <p class="auth-toggle">Don't have an account? <a href="#" onclick="toggleAuth()">Register</a></p>
      </div>

      <div class="auth-form" id="register-form-container" style="display: none;">
        <h2>Register</h2>
        <form id="register-form">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="register-name" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" id="register-email" required>
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="tel" id="register-phone">
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="register-password" required>
          </div>

          <button type="submit" class="btn-primary">Register</button>
        </form>

        <p class="auth-toggle">Already have an account? <a href="#" onclick="toggleAuth()">Login</a></p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 SecondHand - Buy & Sell Used Items. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
