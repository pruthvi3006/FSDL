<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard — Assignment 4</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <h1>Student Performance Dashboard</h1>
    <p class="tag">Interactive academic performance explorer</p>
  </header>

  <section class="controls">
    <label>
      Student:
      <select id="studentSelect">
        <option value="student_1">Rahul Sharma</option>
        <option value="student_2">Priya Verma</option>
        <option value="student_3">Amit Patel</option>
      </select>
    </label>

    <label>
      Term:
      <select id="termSelect">
        <option value="1">Term 1</option>
        <option value="2">Term 2</option>
      </select>
    </label>

    <label>
      Range:
      <select id="rangeSelect">
        <option value="7">Last 7 Weeks</option>
        <option value="14">Last 14 Weeks</option>
      </select>
    </label>
  </section>

  <main class="dashboard">
    <div class="summary-cards">
      <div class="card" id="card-marks">
        <h3>Average Marks</h3>
        <div class="value" id="avgMarks">—</div>
      </div>
      <div class="card" id="card-attendance">
        <h3>Average Attendance</h3>
        <div class="value" id="avgAttendance">—</div>
      </div>
      <div class="card" id="card-assignments">
        <h3>Total Assignments</h3>
        <div class="value" id="totalAssignments">—</div>
      </div>
    </div>

    <section class="charts">
      <div class="chart-card">
        <h2>Marks Trend</h2>
        <canvas id="marksChart"></canvas>
      </div>

      <div class="chart-card">
        <h2>Assignments Submitted</h2>
        <canvas id="assignmentChart"></canvas>
      </div>

      <div class="chart-card">
        <h2>Attendance Percentage</h2>
        <canvas id="attendanceChart"></canvas>
      </div>

      <div class="chart-card">
        <h2>Grade Distribution</h2>
        <canvas id="donutChart"></canvas>
      </div>
    </section>
  </main>

  <footer class="footer">Sample student data — interactive local demo</footer>

  <script src="script.js" defer></script>
</body>
</html>
